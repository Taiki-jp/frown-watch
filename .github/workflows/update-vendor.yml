# 同梱している MediaPipe の新しい版が npm に出ていたら、入れ替えた PR を作る。
# 検出の動作は CI では試せないので、自動マージはしない。PR を手元で開いて確かめてからマージする
name: Update vendored MediaPipe

on:
  schedule:
    - cron: "0 0 * * 1" # 毎週月曜 9:00 JST
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: update-vendor
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - id: up
        run: node scripts/update-vendor.mjs

      - if: steps.up.outputs.updated == 'true'
        run: for f in test/*.test.mjs; do node "$f"; done

      - if: steps.up.outputs.updated == 'true'
        uses: peter-evans/create-pull-request@3ffccacd46053766916f087ce41d627c0b8cf2d1 # v8.1.3
        with:
          branch: deps/mediapipe
          delete-branch: true
          commit-message: "MediaPipe を ${{ steps.up.outputs.to }} に上げる"
          title: "MediaPipe を ${{ steps.up.outputs.from }} から ${{ steps.up.outputs.to }} に上げる"
          body: |
            `@mediapipe/tasks-vision` の新しい版を同梱し直しました。tgz は npm registry の integrity と照合済みです。

            - リリースノート: https://github.com/google-ai-edge/mediapipe/releases
            - 単体テストは CI で通っています。カメラを使う検出は CI では試せません

            マージ前に手元で確かめること:
            - [ ] `app.html` でカメラを開始し、顔が検出されて目盛りが動く
            - [ ] 眉間に力を入れると小窓が赤くなる
            - [ ] DevTools のコンソールにエラーが出ていない

      # モデルは URL に版番号が入っている。次の版が出ていたら Issue で知らせる (同じ Issue は作り直さない)
      - name: Check for a newer face_landmarker model
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          next=2
          url="https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/${next}/face_landmarker.task"
          if ! curl -sfI "$url" > /dev/null; then echo "no float16/${next} model yet"; exit 0; fi
          title="face_landmarker の float16/${next} が出ている"
          if [ -n "$(gh issue list --state all --search "in:title \"$title\"" --json number --jq '.[].number')" ]; then exit 0; fi
          gh issue create --title "$title" --body "新しいモデルが公開されています: $url

          入れ替えるときは vendor/models/face_landmarker.task を差し替え、vendor/NOTICE.md の取得元と SHA-256 を直し、このワークフローの next を上げてください。"
